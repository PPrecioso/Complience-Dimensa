services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: compliance_ai
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://compliance:compliance@db:5432/compliance_ai
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
